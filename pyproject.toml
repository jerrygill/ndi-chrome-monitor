[project]
name = "ndi-chrome-monitor"
version = "0.1.0"
description = "Mobile-friendly web NDI Monitor with top Chrome tab, Google Meet, Google Slides, and YouTube controls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "cyndilib>=0.1.3",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "qrcode>=8.0",
]
